<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
<title>Mohammadreza Azarmi — Neural Engineering Command Interface</title>
<desc>Dark futuristic engineering command interface with black, red, neon green and white accents.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030505"/><stop offset=".5" stop-color="#090d0c"/><stop offset="1" stop-color="#020303"/>
  </linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff1838"/><stop offset="1" stop-color="#ff3b18"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39ff88"/><stop offset="1" stop-color="#b6ff39"/></linearGradient>
  <radialGradient id="reactor"><stop stop-color="#39ff88" stop-opacity=".26"/><stop offset=".45" stop-color="#18ff75" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#39ff88" stroke-opacity=".055"/></pattern>
  <filter id="glowG"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowR"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="screen"><rect x="1" y="1" width="1278" height="478" rx="26"/></clipPath>
</defs>

<rect width="1280" height="480" rx="28" fill="url(#bg)"/>
<rect x="1" y="1" width="1278" height="478" rx="27" fill="url(#grid)" stroke="#39ff88" stroke-opacity=".22"/>
<g clip-path="url(#screen)">
  <path d="M0 72H1280" stroke="#ff1838" stroke-opacity=".42"/>
  <path d="M0 75H820" stroke="#ff1838" stroke-opacity=".12"/>
  <path d="M0 440H1280" stroke="#39ff88" stroke-opacity=".18"/>
  <circle cx="1030" cy="245" r="215" fill="url(#reactor)"/>

  <!-- ambient circuit traces -->
  <g fill="none" stroke-linecap="round">
    <path d="M38 116H175V92H258" stroke="#39ff88" stroke-opacity=".55"/>
    <path d="M38 132H135V150H220" stroke="#ff1838" stroke-opacity=".65"/>
    <path d="M1030 88H1160V112H1250" stroke="#39ff88" stroke-opacity=".6"/>
    <path d="M1070 392H1195V365H1250" stroke="#ff1838" stroke-opacity=".5"/>
    <circle cx="258" cy="92" r="3" fill="#39ff88"/>
    <circle cx="220" cy="150" r="3" fill="#ff1838"/>
    <circle cx="1160" cy="112" r="3" fill="#39ff88"/>
    <circle cx="1195" cy="365" r="3" fill="#ff1838"/>
  </g>

  <!-- command reactor -->
  <g fill="none" filter="url(#glowG)">
    <circle cx="1030" cy="245" r="142" stroke="#39ff88" stroke-width="1" stroke-opacity=".28" stroke-dasharray="2 14">
      <animateTransform attributeName="transform" type="rotate" from="0 1030 245" to="360 1030 245" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="245" r="112" stroke="#39ff88" stroke-width="2" stroke-opacity=".62" stroke-dasharray="48 12 4 16">
      <animateTransform attributeName="transform" type="rotate" from="360 1030 245" to="0 1030 245" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="245" r="82" stroke="#ff1838" stroke-width="1.5" stroke-opacity=".65" stroke-dasharray="8 20">
      <animateTransform attributeName="transform" type="rotate" from="0 1030 245" to="360 1030 245" dur="8s" repeatCount="indefinite"/>
    </circle>
    <path d="M885 245H1175M1030 100V390" stroke="#39ff88" stroke-opacity=".18"/>
    <circle cx="1030" cy="245" r="52" stroke="#fff" stroke-opacity=".55"/>
  </g>
  <g transform="translate(1030 245)" filter="url(#glowG)">
    <circle r="39" fill="#050807" stroke="#39ff88" stroke-width="2"/>
    <circle r="26" fill="none" stroke="#ff1838" stroke-width="2" stroke-dasharray="3 8"/>
    <path d="M-17 0L-5 12L21 -16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle r="6" fill="#39ff88"><animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- scanning line -->
  <rect x="70" y="205" width="690" height="2" fill="url(#green)" opacity=".7">
    <animate attributeName="x" values="70;720;70" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- left information panel -->
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="68" y="48" fill="#39ff88" font-size="12" font-weight="700" letter-spacing="5">AZARMI // ENGINEERING INTELLIGENCE</text>
    <text x="68" y="140" fill="#ffffff" font-size="48" font-weight="900" letter-spacing="1">MOHAMMADREZA</text>
    <text x="68" y="188" fill="#ffffff" font-size="48" font-weight="900" letter-spacing="1">AZARMI</text>
    <rect x="70" y="207" width="8" height="8" fill="#ff1838"/>
    <text x="94" y="216" fill="#d9e4df" font-size="16" font-weight="700" letter-spacing="2">CIVIL ENGINEER · CONCRETE QC · AI BUILDER</text>

    <text x="70" y="270" fill="#39ff88" font-size="12" font-weight="800" letter-spacing="4">SYSTEM PRINCIPLES</text>
    <g fill="#ffffff" font-size="13">
      <text x="70" y="302">01  EVIDENCE OVER GUESSING</text>
      <text x="70" y="329">02  REAL STATE ONLY</text>
      <text x="70" y="356">03  HUMAN GOVERNANCE</text>
      <text x="70" y="383">04  BUILD · VERIFY · SHIP · LEARN</text>
    </g>
    <g fill="#39ff88" font-size="10" font-weight="700" letter-spacing="2">
      <text x="70" y="427">CONCRETE</text><text x="175" y="427">×</text><text x="195" y="427">DATA</text><text x="265" y="427">×</text><text x="285" y="427">AI</text><text x="330" y="427">×</text><text x="350" y="427">ENGINEERING</text>
    </g>
  </g>

  <!-- right status readout -->
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="850" y="60" fill="#ff1838" font-size="10" font-weight="800" letter-spacing="3">JARVIS-LIKE COMMAND LAYER</text>
    <text x="850" y="84" fill="#ffffff" font-size="12" letter-spacing="2">SYSTEM STATUS</text>
    <g fill="#b9c8c2" font-size="11">
      <text x="850" y="112">AGENT HQ</text><text x="850" y="137">CRETIQ</text><text x="850" y="162">VIRTUAL LAB</text><text x="850" y="187">R&amp;D</text>
    </g>
    <g>
      <rect x="930" y="103" width="150" height="5" rx="2" fill="#13201a"/><rect x="930" y="103" width="142" height="5" rx="2" fill="url(#green)"/>
      <rect x="930" y="128" width="150" height="5" rx="2" fill="#13201a"/><rect x="930" y="128" width="126" height="5" rx="2" fill="url(#green)"/>
      <rect x="930" y="153" width="150" height="5" rx="2" fill="#13201a"/><rect x="930" y="153" width="118" height="5" rx="2" fill="url(#green)"/>
      <rect x="930" y="178" width="150" height="5" rx="2" fill="#241114"/><rect x="930" y="178" width="92" height="5" rx="2" fill="url(#red)"/>
    </g>
    <text x="1110" y="112" fill="#39ff88" font-size="9">ONLINE</text>
    <text x="1110" y="137" fill="#39ff88" font-size="9">BUILD</text>
    <text x="1110" y="162" fill="#39ff88" font-size="9">ACTIVE</text>
    <text x="1110" y="187" fill="#ff1838" font-size="9">R&amp;D</text>

    <rect x="850" y="210" width="150" height="1" fill="#39ff88" opacity=".5"/>
    <text x="850" y="238" fill="#39ff88" font-size="10" font-weight="800" letter-spacing="2">COMMAND / READY</text>
    <text x="850" y="260" fill="#8b9b94" font-size="10">REAL PROJECTS</text>
    <text x="850" y="280" fill="#8b9b94" font-size="10">REAL EVIDENCE</text>
    <text x="850" y="300" fill="#8b9b94" font-size="10">CONTROLLED AI</text>
    <text x="850" y="336" fill="#ffffff" font-size="12" font-weight="700">NEVER INVENT THE DATA</text>
    <text x="850" y="358" fill="#ff1838" font-size="9" letter-spacing="2">SYSTEMS UNDER CONSTRUCTION</text>
  </g>

  <!-- frame accents -->
  <path d="M28 28h105M28 28v105M1252 28h-105M1252 28v105M28 452h105M28 452v-105M1252 452h-105M1252 452v-105" fill="none" stroke="#39ff88" stroke-width="2" opacity=".7"/>
  <path d="M28 28h36M1252 28h-36M28 452h36M1252 452h-36" stroke="#ff1838" stroke-width="4"/>
</g>
</svg>