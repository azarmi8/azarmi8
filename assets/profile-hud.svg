 </rect>
 <text x="86" y="253" fill="#d8cec7" font-size="17" font-weight="700" letter-spacing="2">CIVIL ENGINEER · CONCRETE QC · AI SYSTEMS BUILDER</text>
 <text x="60" y="310" fill="#d98a5f" font-size="12" font-weight="800" letter-spacing="4">ENGINEERING REALITY → TRACEABLE EVIDENCE → CONTROLLED INTELLIGENCE</text>
 <text x="60" y="348" fill="#9b908a" font-size="14">Building software where measurements, provenance, automation and human governance meet.</text>

 <g transform="translate(60 390)">
   <rect width="186" height="36" rx="8" fill="#141418" stroke="#d98a5f" stroke-opacity=".34"/>
   <text x="18" y="23" fill="#eee7e2" font-size="11" font-weight="800">SYSTEM BUILDER</text>
   <rect x="198" width="186" height="36" rx="8" fill="#141418" stroke="#b85c48" stroke-opacity=".34"/>
   <text x="216" y="23" fill="#eee7e2" font-size="11" font-weight="800">ENGINEERING FIRST</text>
   <rect x="396" width="186" height="36" rx="8" fill="#141418" stroke="#d98a5f" stroke-opacity=".34"/>
   <text x="414" y="23" fill="#eee7e2" font-size="11" font-weight="800">EVIDENCE DRIVEN</text>
 </g>

 <g transform="translate(1108 258)" filter="url(#glow)">
  <circle r="150" fill="#d98a5f" opacity=".035"/>
  <circle r="128" fill="none" stroke="#d98a5f" stroke-opacity=".24" stroke-dasharray="2 15">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle r="98" fill="none" stroke="#d98a5f" stroke-width="2" stroke-opacity=".65" stroke-dasharray="42 12 4 14">
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle r="72" fill="none" stroke="#b85c48" stroke-width="1.5" stroke-opacity=".7" stroke-dasharray="7 17">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="46" fill="#141418" stroke="#eee7e2" stroke-opacity=".55"/>
  <path d="M-24 0H24M0-24V24" stroke="#d98a5f" stroke-opacity=".45"/>
  <circle r="11" fill="url(#g)">
    <animate attributeName="r" values="9;13;9" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".65;1;.65" dur="2s" repeatCount="indefinite"/>
  </circle>
  <path d="M-168 0H-118M118 0H168M0-168V-118M0 118V168" stroke="#d98a5f" stroke-opacity=".32"/>
  <path d="M-104 -104L-72 -72M104 104L72 72M104 -104L72 -72M-104 104L-72 72" stroke="#b85c48" stroke-opacity=".45"/>
 </g>

 <g transform="translate(892 418)">
  <text x="0" y="0" fill="#eee7e2" font-size="10" font-weight="800" letter-spacing="3">SIGNATURE</text>
  <text x="0" y="20" fill="#d98a5f" font-size="11" letter-spacing="2">CONCRETE × DATA × AI × ENGINEERING</text>
