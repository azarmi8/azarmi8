 <text x="58" y="487" fill="#77706c" font-size="10" letter-spacing="2">NO FAKE TELEMETRY · NO INVENTED EVIDENCE · NO SILENT PAID FALLBACK</text>
 <text x="1342" y="487" text-anchor="end" fill="#d98a5f" font-size="10" font-weight="800" letter-spacing="2">SYSTEMS UNDER CONSTRUCTION</text>
