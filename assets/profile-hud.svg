<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="t d">
<title id="t">Mohammadreza Azarmi — Engineering Intelligence</title>
<desc id="d">Animated industrial command interface in GitHub dark-theme colors with warm copper, brown and charcoal signals.</desc>
<defs>
 <linearGradient id="g" x1="0" x2="1"><stop stop-color="#d98a5f"/><stop offset="1" stop-color="#e5ae96"/></linearGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#d98a5f" stroke-opacity=".045"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="520" rx="26" fill="#141418"/>
<rect x="1" y="1" width="1398" height="518" rx="25" fill="url(#grid)" stroke="#d98a5f" stroke-opacity=".18"/>
<path d="M0 82H1400" stroke="#b85c48" stroke-opacity=".42"/>
<path d="M48 454H1352" stroke="#d98a5f" stroke-opacity=".16"/>

<g font-family="Arial,Helvetica,sans-serif">
 <text x="58" y="50" fill="#d98a5f" font-size="12" font-weight="800" letter-spacing="5">AZARMI // ENGINEERING INTELLIGENCE</text>
 <text x="1342" y="50" text-anchor="end" fill="#c06f55" font-size="10" font-weight="800" letter-spacing="3">PERSONAL COMMAND INTERFACE</text>
 <text x="58" y="158" fill="#eee7e2" font-size="58" font-weight="900">MOHAMMADREZA</text>
 <text x="58" y="216" fill="#eee7e2" font-size="58" font-weight="900">AZARMI</text>
 <rect x="60" y="244" width="8" height="8" fill="#b85c48">
