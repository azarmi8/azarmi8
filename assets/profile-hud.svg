<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="t d">
<title id="t">Mohammadreza Azarmi — Engineering Intelligence</title>
<desc id="d">A dark industrial command interface using black, neon green, red and white.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020303"/><stop offset=".55" stop-color="#0a0d0b"/><stop offset="1" stop-color="#030404"/></linearGradient>
 <linearGradient id="g" x1="0" x2="1"><stop stop-color="#39ff88"/><stop offset="1" stop-color="#b7ff39"/></linearGradient>
 <linearGradient id="r" x1="0" x2="1"><stop stop-color="#ff1638"/><stop offset="1" stop-color="#ff5b2d"/></linearGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#39ff88" stroke-opacity=".045"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="520" rx="26" fill="url(#bg)"/>
<rect x="1" y="1" width="1398" height="518" rx="25" fill="url(#grid)" stroke="#39ff88" stroke-opacity=".2"/>
<path d="M0 82H1400" stroke="#ff1638" stroke-opacity=".42"/>
<path d="M48 454H1352" stroke="#39ff88" stroke-opacity=".16"/>

<g font-family="Arial,Helvetica,sans-serif">
