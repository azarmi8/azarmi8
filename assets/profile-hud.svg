 <rect x="60" y="244" width="8" height="8" fill="#ff1638"/>
 <text x="86" y="253" fill="#dce6e1" font-size="17" font-weight="700" letter-spacing="2">CIVIL ENGINEER · CONCRETE QC · AI SYSTEMS BUILDER</text>

 <text x="60" y="310" fill="#39ff88" font-size="12" font-weight="800" letter-spacing="4">ENGINEERING REALITY → TRACEABLE EVIDENCE → CONTROLLED INTELLIGENCE</text>
 <text x="60" y="348" fill="#8ea099" font-size="14">Building software where measurements, provenance, automation and human governance meet.</text>

 <g transform="translate(60 390)">
