   <rect x="396" width="186" height="36" rx="8" fill="#070a08" stroke="#39ff88" stroke-opacity=".34"/>
   <text x="414" y="23" fill="#ffffff" font-size="11" font-weight="800">EVIDENCE DRIVEN</text>
 </g>

 <!-- signature reactor -->
 <g transform="translate(1108 258)" filter="url(#glow)">
  <circle r="150" fill="#39ff88" opacity=".045"/>
  <circle r="128" fill="none" stroke="#39ff88" stroke-opacity=".25" stroke-dasharray="2 15"/>
  <circle r="98" fill="none" stroke="#39ff88" stroke-width="2" stroke-opacity=".65" stroke-dasharray="42 12 4 14"/>
  <circle r="72" fill="none" stroke="#ff1638" stroke-width="1.5" stroke-opacity=".7" stroke-dasharray="7 17"/>
  <circle r="46" fill="#050807" stroke="#ffffff" stroke-opacity=".65"/>
