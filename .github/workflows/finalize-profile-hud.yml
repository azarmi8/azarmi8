name: Finalize profile HUD

on:
  push:
    branches: [main]
    paths:
      - "scripts/finalize-profile-hud.py"
      - ".github/workflows/finalize-profile-hud.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate final animated HUD
        run: python scripts/finalize-profile-hud.py
      - name: Verify GIF
        run: |
          test -f assets/profile-hud.gif
          python - <<'PY'
          from PIL import Image
          im = Image.open("assets/profile-hud.gif")
          assert im.format == "GIF"
          assert im.n_frames == 16
          assert im.size == (1200, 430)
          print("FINAL PROFILE HUD OK:", im.n_frames, "frames", im.size)
          PY
      - name: Keep only final asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-hud.gif
          git rm -f scripts/finalize-profile-hud.py .github/workflows/finalize-profile-hud.yml
          git commit -m "feat: finalize animated warm industrial profile HUD [skip ci]"
          git push
