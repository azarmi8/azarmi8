name: Generate profile HUD GIF

on:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-profile-hud.py"
      - ".github/workflows/generate-profile-hud.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate animated HUD
        run: python scripts/generate-profile-hud.py

      - name: Verify GIF
        run: |
          test -f assets/profile-hud.gif
          python - <<'PY'
          from PIL import Image
          p = "assets/profile-hud.gif"
          im = Image.open(p)
          assert im.format == "GIF"
          assert im.n_frames >= 8
          assert im.size == (1000, 371)
          print("GIF verification OK:", im.n_frames, "frames", im.size)
          PY

      - name: Commit generated asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-hud.gif
          if git diff --cached --quiet; then
            echo "No GIF change."
            exit 0
          fi
          git commit -m "chore: generate animated profile HUD [skip ci]"
          git push
